name: PR Title

# PRs are squash-merged with their title as the commit message, and
# release-please reads that message to version packages. So the title must be
# a Conventional Commit: "feat(web-extension): …", "fix: …", "chore: …".

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
