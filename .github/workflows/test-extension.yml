name: Test Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Chromium
        run: pnpm --filter @react-grab/web-extension exec playwright install chromium --with-deps

      - name: Build extension
        run: pnpm extension:build

      - name: Unit tests
        run: pnpm --filter @react-grab/web-extension test

      - name: Load the built extension in Chromium
        run: pnpm --filter @react-grab/web-extension test:e2e
