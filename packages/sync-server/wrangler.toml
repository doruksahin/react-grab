name = "react-grab-sync-server"
# Personal Cloudflare account, chosen for now; moves to a company account last.
# Pinned so a deploy cannot land in another account a login happens to reach.
account_id = "601031668a1130f8c22117a0ea8e5e63"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Non-secret configuration. Secrets never belong here — see .dev.vars.example
# for the full list of what the Worker needs, and ADR-0018 for why.
#
# JIRA_BASE_URL decides which Jira site every ticket is created on.
[vars]
ENVIRONMENT = "development"
JIRA_BASE_URL = "https://doruksahin.atlassian.net"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "react-grab-sync"
database_id = "6f0223f9-025b-481a-a2e3-3d1e77c46904"
migrations_dir = "drizzle"

# R2 bucket binding
[[r2_buckets]]
bucket_name = "react-grab-screenshots"
binding = "BUCKET"
