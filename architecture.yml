data_flows:
  sync_layer:
    description: Server data loading, JIRA polling, and reactive state
    composition_root: packages/react-grab/src/features/sync/sync-layer.ts
    store: packages/react-grab/src/features/sync/store/sync-store.ts
    init_sequence:
      1: "host calls initSync(config) → syncLayer.init(config)"
      2: "init() creates httpAdapter, awaits loadGroups + loadComments"
      3: "reconcile data into createStore → reactive state available"
      4: "startPolling() begins 30s JIRA status interval"
      5: "host calls init() → UI reads from store reactively"
    sources:
      groups:
        store_path: store.groups
        load: sync-layer.ts init() → adapter.loadGroups()
        persist: sync-layer.ts persistGroups() → adapter.persistGroups()
        consumers:
          - components/sidebar/* (group list, detail view)
          - components/selection-label/* (status colors, JIRA meta)
          - features/selection-groups/index.ts (CRUD operations)
      comments:
        store_path: store.comments
        load: sync-layer.ts init() → adapter.loadComments()
        persist: sync-layer.ts persistComments() → adapter.persistComments()
        consumers:
          - components/selection-label/* (comment text, count)
          - components/comments-dropdown.tsx
          - features/selection-visibility/index.ts (reveal state)
      jira_status:
        store_path: store.groups[i].jiraStatus (fine-grained per-group)
        trigger: pollJira() via 30s setInterval
        fields_updated:
          - jiraStatus, jiraStatusCategory, jiraUrl
          - jiraAssignee, jiraReporter, jiraAssigneeAvatar, jiraReporterAvatar
          - jiraComments, jiraLabels, jiraResolved
          - jiraFlagged, jiraFlaggedAt, jiraFlaggedBy, jiraFlaggedByAvatar
        consumers:
          - components/sidebar/group-card.tsx (status badge)
          - components/selection-label/* (inline status)
          - components/jira-comments/* (comment list)

# ─── API contract flow ────────────────────────────────────────────────────────

api_contract:
  description: Zod schemas → OpenAPI spec → Orval codegen → typed fetch clients
  source_of_truth: packages/sync-server/src/schemas/index.ts
  openapi_spec: packages/sync-server/openapi.json
  consumers:
    react-grab: packages/react-grab/src/generated/sync-api.ts
    dashboard: packages/dashboard/src/api/endpoints/
  commands:
    export_spec: pnpm --filter @react-grab/sync-server export-spec
    codegen_react_grab: pnpm --filter react-grab codegen
    codegen_dashboard: pnpm --filter dashboard codegen
    verify: pnpm check:codegen

