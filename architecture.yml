data_flows:
  sync_layer:
    description: Server data loading, JIRA polling, and reactive state
    composition_root: packages/react-grab/src/features/sync/sync-layer.ts
    store: packages/react-grab/src/features/sync/store/sync-store.ts
    init_sequence:
      1: "host calls initSync(config) → syncLayer.init(config)"
      2: "init() creates httpAdapter, awaits loadGroups + loadComments"
      3: "reconcile data into createStore → reactive state available"
      4: "startPolling() begins 30s JIRA status interval"
      5: "host calls init() → UI reads from store reactively"
    sources:
      groups:
        store_path: store.groups
        load: sync-layer.ts init() → adapter.loadGroups()
        persist: sync-layer.ts persistGroups() → adapter.persistGroups()
        consumers:
          - packages/react-grab/src/core/index.tsx
          - packages/react-grab/src/features/sync/index.ts
          - packages/react-grab/src/features/sync/sync-layer.ts
      comments:
        store_path: store.comments
        load: sync-layer.ts init() → adapter.loadComments()
        persist: sync-layer.ts persistComments() → adapter.persistComments()
        consumers:
          - packages/react-grab/src/core/index.tsx
          - packages/react-grab/src/features/sync/index.ts
          - packages/react-grab/src/features/sync/sync-layer.ts
      jira_status:
        store_path: store.groups[i].jiraStatus (fine-grained per-group)
        trigger: pollJira() via 30s setInterval
        fields_updated:
          - jiraStatus, jiraStatusCategory, jiraUrl
          - jiraAssignee, jiraReporter, jiraAssigneeAvatar, jiraReporterAvatar
          - jiraComments, jiraLabels, jiraResolved
          - jiraFlagged, jiraFlaggedAt, jiraFlaggedBy, jiraFlaggedByAvatar
        consumers:
          - packages/react-grab/src/core/index.tsx
          - packages/react-grab/src/features/sync/index.ts
          - packages/react-grab/src/features/sync/sync-layer.ts

# ─── Data attributes catalog ──────────────────────────────────────────────────
# Catalog of `data-react-grab-*` DOM identifiers used by the overlay (event
# boundaries), Playwright tests (selectors), and debugging.
#
# - `scopes` is authored — declares valid attr suffixes grouped by region.
# - `reserved` is authored — internal machinery exempt from R1-R4 rules.
# - `inventory` is generated by `pnpm arch:codegen` — do not edit manually.
# - `pnpm arch:lint` fails if an attr in code matches no scope.
# - Rules doc: packages/react-grab/docs/data-attrs.md

data_attrs:
  description: Catalog of data-react-grab-* attributes — DOM identifiers for overlay, tests, debugging
  rules_doc: packages/react-grab/docs/data-attrs.md
  scan_roots:
    - packages/react-grab/src
    - packages/react-grab/e2e

  # Reserved attrs — internal machinery, exempt from R1-R4.
  reserved:
    - ignore
    - ignore-events
    - frozen
    - frozen-pseudo
    - frozen-styles
    - global-freeze

  # Scope declarations. Each `owns` entry is the attr suffix (the part after
  # `data-react-grab-`). An attr is valid if its suffix matches one entry in
  # some scope's `owns` list, or appears in `reserved`.
  scopes:

    overlay:
      description: Overlay canvas, context menu, cursor/arrow chrome
      owning_feature: selection-status-colors
      owns:
        - overlay-canvas
        - cursor
        - arrow
        - context-menu
        - menu-item

    toolbar:
      description: Floating bottom toolbar
      owning_feature: sidebar
      owns:
        - toolbar
        - toolbar-toggle
        - toolbar-collapse
        - toolbar-menu
        - toolbar-visibility
        - toolbar-devmode
        - toolbar-comments
        - toolbar-copy-all
        - toolbar-dashboard

    sidebar:
      description: Sidebar shell + all top-level regions (header, tabs, filters, lists, detail view)
      owning_feature: sidebar
      owns:
        - sidebar
        - sidebar-header
        - sidebar-search
        - stats-bar
        - tab-bar
        - status-legend
        - filter-chips
        - progress-bar
        - bulk-action-bar
        - bulk-group-picker
        - jira-status-banner
        - empty-state
        - ungrouped-section
        - due-date-filter
        - active-group-picker
        - active-group-picker-locked
        - detail-header
        - group-card
        - group-detail
        - group-list
        - loose-selection-card
        - loose-selection-list
        - selection-list

    selection:
      description: Selection labels, cards, badges, keyboard nav
      owning_feature: selection-groups
      owns:
        - selection-label
        - selection-card
        - selection-card-body
        - status-badge
        - unread-indicator
        - collapse-label
        - collapsed-dot
        - collapsed-dot-preview
        - screenshot-pair
        - screenshot-thumb
        - action-cycle-item
        - arrow-nav-item
        - arrow-nav-index
        - selection-remove
        - dev-insights

    generation:
      description: Active generation flow inside a selection label (prompt textarea, submit, abort)
      owning_feature: selection-groups
      owns:
        - generation-input
        - generation-abort

    completion:
      description: Selection-label completion view — streaming result, follow-up, undo/dismiss/more-options
      owning_feature: selection-groups
      owns:
        - completion
        - completion-more-options
        - completion-undo
        - completion-dismiss
        - followup-input
        - followup-submit

    error:
      description: Selection-label error view
      owning_feature: selection-groups
      owns:
        - error
        - error-ok
        - error-retry

    dialog:
      description: Confirmation prompts inside selection labels
      owning_feature: selection-groups
      owns:
        - discard-prompt
        - discard-yes
        - discard-no
        - clear-comments-prompt

    jira:
      description: JIRA ticket creation dialog + form
      owning_feature: jira-ticket-creation
      owns:
        - jira-dialog
        - jira-form
        - jira-create
        - jira-dots
        - create-ticket
        - jira-ticket-link

    comments:
      description: JIRA comment authoring, display, mention picker, comment thread
      owning_feature: jira-comments-write
      owns:
