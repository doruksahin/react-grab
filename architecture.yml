# architecture.yml — Serena MCP navigation index
#
# Structure:
#   packages:  — entry points + feature directories per package (lean, Serena discovers the rest)
#   features:  — flat cross-package feature map (the thing Serena can't discover itself)
#   api_contract: — Zod → OpenAPI → Orval codegen flow
#   decree:    — PRD/SPEC/ADR index with file paths and statuses

# ─── Packages ─────────────────────────────────────────────────────────────────
# Entry points and feature directories only. Serena discovers individual files.

packages:

  react-grab:
    description: Core overlay library (Solid.js) — element selection, sync, JIRA UI
    entry: packages/react-grab/src/index.ts
    core: packages/react-grab/src/core/index.tsx
    types: packages/react-grab/src/types.ts
    constants: packages/react-grab/src/constants.ts
    generated_api: packages/react-grab/src/generated/sync-api.ts
    features:
      sidebar:
        description: Embedded dashboard sidebar — groups list, detail view, filters
        index: packages/react-grab/src/features/sidebar/index.ts
      selection-groups:
        description: Group management — create, rename, assign, synthetic groups
        index: packages/react-grab/src/features/selection-groups/index.ts
      selection-visibility:
        description: Reveal/hide selections on canvas — filter integration
        index: packages/react-grab/src/features/selection-visibility/index.ts
      screenshot:
        description: Full-page + element screenshots with highlight overlay
        index: packages/react-grab/src/features/screenshot/index.ts
      sync:
        description: Reactive sync layer — createStore + reconcile for server state
        index: packages/react-grab/src/features/sync/index.ts
        composition_root: packages/react-grab/src/features/sync/sync-layer.ts
        store: packages/react-grab/src/features/sync/store/sync-store.ts
      jira-comments:
        description: JIRA comment authoring — optimistic updates, reply threading
        index: packages/react-grab/src/features/jira-comments/use-jira-comments.ts
    components:
      sidebar: packages/react-grab/src/components/sidebar/
      jira-comments: packages/react-grab/src/components/jira-comments/
      selection-label: packages/react-grab/src/components/selection-label/
      toolbar: packages/react-grab/src/components/toolbar/
      overlay-canvas: packages/react-grab/src/components/overlay-canvas.tsx
      renderer: packages/react-grab/src/components/renderer.tsx

  sync-server:
    description: Cloudflare Worker — Hono + D1 + R2, persists selections, JIRA proxy
    entry: packages/sync-server/src/app.ts
    worker: packages/sync-server/src/worker.ts
    types: packages/sync-server/src/types.ts
    config: packages/sync-server/wrangler.toml
    routes:
      comments: packages/sync-server/src/routes/comments.ts
      groups: packages/sync-server/src/routes/groups.ts
      screenshots: packages/sync-server/src/routes/screenshots.ts
      jira: packages/sync-server/src/routes/jira.ts
      health: packages/sync-server/src/routes/health.ts
    schemas:
      index: packages/sync-server/src/schemas/index.ts
      comment: packages/sync-server/src/schemas/comment.ts
      group: packages/sync-server/src/schemas/group.ts
      jira: packages/sync-server/src/schemas/jira.ts
      common: packages/sync-server/src/schemas/common.ts
    repositories:
      index: packages/sync-server/src/repositories/index.ts
      d1: packages/sync-server/src/repositories/d1.repo.ts
      r2: packages/sync-server/src/repositories/r2.store.ts
    services:
      jira-service:
        description: JIRA API — tickets, status, comments, flags, users
        file: packages/sync-server/src/services/jira.service.ts
        capabilities:
          - createTicketFromGroup
          - getIssueStatus
          - addComment
          - uploadBase64Images
          - searchUsers
          - fetchThreadedComments
      jira-adf-mentions:
        description: Convert @Name text patterns to ADF mention nodes
        file: packages/sync-server/src/services/jira-adf-mentions.ts
        test: packages/sync-server/src/services/__tests__/jira-adf-mentions.test.ts
    db:
      schema: packages/sync-server/src/db/schema.ts
      migrations: packages/sync-server/drizzle/
    middleware:
      inject_repos: packages/sync-server/src/middleware/inject-repos.ts

  dashboard:
    description: React Vite SPA — workspace dashboard, groups/selections views
    entry: packages/dashboard/src/main.tsx
    router: packages/dashboard/src/router.tsx
    pages:
      groups_list: packages/dashboard/src/pages/groups/list.tsx
      groups_detail: packages/dashboard/src/pages/groups/detail.tsx
      selections_list: packages/dashboard/src/pages/selections/list.tsx
      selections_detail: packages/dashboard/src/pages/selections/detail.tsx
      settings: packages/dashboard/src/pages/settings/index.tsx
    api: packages/dashboard/src/api/endpoints/

  cli:
    description: CLI installer — npx grab@latest init
    entry: packages/cli/src/cli.ts
    commands:
      init: packages/cli/src/commands/init.ts
      add: packages/cli/src/commands/add.ts
      remove: packages/cli/src/commands/remove.ts
      configure: packages/cli/src/commands/configure.ts

  mcp:
    description: MCP server for Claude Code / Cursor agent integration
    entry: packages/mcp/src/cli.ts
    server: packages/mcp/src/server.ts
    client: packages/mcp/src/client.ts

  gym:
    description: Next.js 15 playground — test MCP & agent integration
    entry: packages/gym/app/layout.tsx
    pages:
      home: packages/gym/app/page.tsx
      dashboard: packages/gym/app/dashboard/page.tsx
      playground: packages/gym/app/playground/page.tsx

  web-extension:
    description: Chrome/Firefox extension
    manifest: packages/web-extension/src/manifest.json
    background: packages/web-extension/src/background/service-worker.ts
    content_scripts:
      react_grab: packages/web-extension/src/content/react-grab.ts
      bridge: packages/web-extension/src/content/bridge.ts

  design-system:
    description: Shared Solid.js component library (tsup)
    entry: packages/design-system/src/index.tsx

